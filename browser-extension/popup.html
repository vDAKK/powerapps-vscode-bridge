<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title data-i18n="extName">Power Apps X VS Code</title>
    <style>
      :root {
        --brand: #4c3bcf;
        --brand-hover: #3e2fb3;
        --brand-soft: #eeecfb;
        --bg: #ffffff;
        --surface: #f6f6f8;
        --border: #e3e3e8;
        --text: #1b1b1f;
        --muted: #6b6b76;
        --ok: #0f7b3f;
        --ok-soft: #e5f4ec;
        --warn: #b35900;
        --warn-soft: #fdf0e1;
        --off: #8a8a94;
        --off-soft: #efeff2;
        --mono: ui-monospace, 'Cascadia Code', 'SF Mono', Consolas, monospace;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --brand: #8b7ff0;
          --brand-hover: #a096f4;
          --brand-soft: #2a2550;
          --bg: #1c1c21;
          --surface: #25252c;
          --border: #34343d;
          --text: #ececf1;
          --muted: #9a9aa6;
          --ok: #4cc38a;
          --ok-soft: #173326;
          --warn: #f0a050;
          --warn-soft: #3a2a17;
          --off: #8a8a94;
          --off-soft: #2c2c33;
          color-scheme: dark;
        }
      }
      * { box-sizing: border-box; }
      body {
        width: 340px;
        margin: 0;
        font: 13px/1.45 system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: var(--text);
        background: var(--bg);
      }
      header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 16px 12px;
        border-bottom: 1px solid var(--border);
      }
      header img { width: 28px; height: 28px; border-radius: 7px; }
      header .title { font-weight: 600; font-size: 14px; letter-spacing: -0.01em; }
      header .version { margin-left: auto; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
      main { padding: 14px 16px 6px; display: grid; gap: 10px; }

      /* Connection status */
      .status {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px;
        border-radius: 10px;
        background: var(--off-soft);
        transition: background 0.2s;
      }
      .status[data-state='connected'] { background: var(--ok-soft); }
      .status[data-state='connecting'] { background: var(--warn-soft); }
      .dot {
        position: relative;
        width: 10px;
        height: 10px;
        flex: none;
        border-radius: 50%;
        background: var(--off);
      }
      [data-state='connected'] .dot { background: var(--ok); }
      [data-state='connecting'] .dot { background: var(--warn); }
      [data-state='connected'] .dot::after,
      [data-state='connecting'] .dot::after {
        content: '';
        position: absolute;
        inset: -4px;
        border-radius: 50%;
        border: 2px solid currentColor;
        color: var(--ok);
        opacity: 0;
        animation: pulse 2s ease-out infinite;
      }
      [data-state='connecting'] .dot::after { color: var(--warn); animation-duration: 1s; }
      @keyframes pulse {
        0% { transform: scale(0.6); opacity: 0.7; }
        100% { transform: scale(1.5); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) { .dot::after { animation: none !important; } }
      .status .label { font-weight: 600; }
      .status .sub { font-size: 12px; color: var(--muted); }

      /* Current formula */
      .card {
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
      }
      .card .k { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 4px; }
      .formula {
        display: flex;
        align-items: baseline;
        gap: 0;
        font: 12.5px var(--mono);
        overflow: hidden;
        white-space: nowrap;
      }
      .formula .ctrl { overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
      .formula .prop { color: var(--brand); flex: none; }
      .chip {
        margin-left: auto;
        padding: 1px 7px;
        border-radius: 999px;
        font: 11px system-ui, sans-serif;
        color: var(--muted);
        background: var(--surface);
        flex: none;
      }

      /* Next step */
      .next {
        display: grid;
        gap: 10px;
        padding: 12px;
        border-radius: 10px;
        background: var(--brand-soft);
      }
      .next p { margin: 0; }
      .next:has(p:empty) { display: none; }

      button, .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        height: 30px;
        padding: 0 12px;
        border-radius: 7px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text);
        font: 500 12.5px system-ui, sans-serif;
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s;
      }
      button:hover { background: var(--surface); }
      button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }
      button.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
      button.primary:hover { background: var(--brand-hover); border-color: var(--brand-hover); }
      button[hidden] { display: none; }
      .next .inline { flex-wrap: wrap; }

      /* Settings */
      details { border-top: 1px solid var(--border); margin-top: 8px; }
      summary {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 10px 16px;
        list-style: none;
        cursor: pointer;
        color: var(--muted);
        font-weight: 500;
        user-select: none;
      }
      summary::-webkit-details-marker { display: none; }
      summary::before {
        content: '';
        width: 6px;
        height: 6px;
        border-right: 1.5px solid currentColor;
        border-bottom: 1.5px solid currentColor;
        transform: rotate(-45deg);
        transition: transform 0.15s;
        margin-right: 2px;
      }
      details[open] summary::before { transform: rotate(45deg); }
      summary:hover { color: var(--text); }
      .panel { display: grid; gap: 12px; padding: 0 16px 14px; }
      .field { display: grid; gap: 4px; }
      .field label { font-size: 12px; font-weight: 500; }
      .field .help { font-size: 11.5px; color: var(--muted); }
      .inline { display: flex; gap: 6px; align-items: center; }
      input[type='number'] {
        width: 90px;
        height: 30px;
        padding: 0 8px;
        border: 1px solid var(--border);
        border-radius: 7px;
        background: var(--bg);
        color: var(--text);
        font: 12.5px var(--mono);
      }
      input:invalid { border-color: #d13438; }
      button.done { color: var(--ok); border-color: var(--ok); }
      textarea {
        width: 100%;
        height: 180px;
        padding: 8px;
        border: 1px solid var(--border);
        border-radius: 7px;
        background: var(--surface);
        color: var(--text);
        font: 11px/1.4 var(--mono);
        resize: vertical;
      }
      textarea[hidden] { display: none; }
      footer {
        display: flex;
        justify-content: space-between;
        padding: 8px 16px 12px;
        font-size: 11px;
        color: var(--muted);
      }
      footer a { color: inherit; text-decoration: none; }
      footer a:hover { color: var(--brand); text-decoration: underline; }
    </style>
  </head>
  <body>
    <header>
      <img src="icons/icon-32.png" alt="" />
      <span class="title" data-i18n="extName">Power Apps X VS Code</span>
      <span class="version" id="version"></span>
    </header>

    <main>
      <section class="status" id="status" data-state="disconnected" role="status" aria-live="polite">
        <span class="dot" aria-hidden="true"></span>
        <div>
          <div class="label" id="state">…</div>
          <div class="sub" id="sub"></div>
        </div>
      </section>

      <section class="card" id="selection" hidden>
        <div class="k" data-i18n="popupActiveFormula">Active formula</div>
        <div class="formula">
          <span class="ctrl" id="ctrl"></span><span class="prop" id="prop"></span>
          <span class="chip" id="mode"></span>
        </div>
      </section>

      <section class="next">
        <p id="hint"></p>
        <div class="inline">
          <button class="primary" id="installVs" hidden data-i18n="popupInstallVs">Install the VS Code extension</button>
          <button class="primary" id="openStudio" hidden data-i18n="openPowerApps">Open Power Apps</button>
          <button class="primary" id="reconnectMain" hidden data-i18n="reconnect">Reconnect</button>
        </div>
      </section>
    </main>

    <details id="settings">
      <summary data-i18n="popupSettings">Settings and troubleshooting</summary>
      <div class="panel">
        <div class="field">
          <label for="port" data-i18n="popupPortLabel">VS Code port</label>
          <div class="inline">
            <input id="port" type="number" min="1" max="65535" required />
            <button id="save" data-i18n="popupSave">Save</button>
            <button id="reconnect" data-i18n="reconnect">Reconnect</button>
          </div>
          <div class="help"><span data-i18n="popupPortHelpBefore">Must match the</span> <code>powerappsBridge.port</code> <span data-i18n="popupPortHelpAfter">setting in VS Code (default 8765).</span></div>
        </div>
        <div class="field">
          <label data-i18n="popupDiagnosticLabel">Diagnostics</label>
          <div class="inline">
            <button id="diag" data-i18n="popupAnalyze">Analyze page</button>
            <button id="copy" hidden data-i18n="popupCopyResult">Copy result</button>
          </div>
          <textarea id="out" hidden readonly aria-label="Diagnostic result" data-i18n-aria-label="popupDiagnosticResultAria"></textarea>
        </div>
      </div>
    </details>

    <footer>
      <span data-i18n="popupUnofficial">Unofficial extension</span>
      <a href="https://github.com/vDAKK/powerapps-vscode-bridge#readme" target="_blank" rel="noopener" data-i18n="help">Help</a>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
